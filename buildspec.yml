version: 0.2

env:
  secrets-manager:
    PRODUCTION_CREDENTIALS_ENC_B64: "biomodelos/frontend/production_yml_enc"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 005235113454.dkr.ecr.us-east-1.amazonaws.com
      - REPOSITORY_URI=005235113454.dkr.ecr.us-east-1.amazonaws.com/biomodelos/frontend
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - echo "Materializing config/credentials/production.yml.enc from Secrets Manager..."
      - mkdir -p config/credentials
      - printf '%s' "$PRODUCTION_CREDENTIALS_ENC_B64" | base64 -d > config/credentials/production.yml.enc
      - 'test -s config/credentials/production.yml.enc || { echo "ERROR: production.yml.enc empty"; exit 1; }'
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      - printf '[{"name":"biomodelos-frontend","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
  post_build:
    commands:
      - echo "Assuming cross account role..."
      - echo deploy image $REPOSITORY_URI:$IMAGE_TAG
      - CREDS=$(aws sts assume-role --role-arn arn:aws:iam::005235113454:role/CodeBuildDeployECSRole --role-session-name codebuild-deploy --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text)
      - export AWS_ACCESS_KEY_ID=$(echo $CREDS | awk '{print $1}')
      - export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | awk '{print $2}')
      - export AWS_SESSION_TOKEN=$(echo $CREDS | awk '{print $3}')
      - echo "Deploying to ECS..."
      - aws ecs update-service --cluster arn:aws:ecs:us-east-1:005235113454:cluster/humbolt-cluster-dev  --service biomodelos-frontend-test-v2 --force-new-deployment
artifacts:
    files: imagedefinitions.json
